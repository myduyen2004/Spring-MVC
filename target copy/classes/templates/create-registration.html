<body>
<div class="container mt-5">
    <h2>Create Job Registration</h2>
    <div th:if="${error != null}">
        <p style="color: red" th:text="${error}"></p>
    </div>
<!--    <div th:if="${#fields.hasErrors('${registration.*}')}" class="alert alert-danger">-->
<!--        <ul>-->
<!--            <li th:each="err : ${#fields.errors('${registration.*}')}" th:text="${err}"></li>-->
<!--        </ul>-->
<!--    </div>-->
    <form th:action="@{/registration/create}" th:object="${jobRegistration}" method="post">
        <label for="employeeId">Mã nhân viên *</label>
        <input type="text" id="employeeId" th:field="*{employee.employeeId}" class="form-control" required placeholder="Nhập mã nhân viên">

                <div class="form-group">
            <label>Họ và tên nhân viên *</label>
            <input type="text" th:field="*{employee.fullName}" class="form-control" required placeholder="Nhập họ và tên">
        </div>
        <div class="form-group">
            <label>Giới tính *</label>
            <input type="text" th:field="*{employee.gender}" class="form-control" required placeholder="Nhập giới tính">
        </div>
        <div class="form-group">
            <label>Cấp bậc nhân viên *</label>
            <select th:field="*{employee.employeeLevel}" class="form-control" required>
                <option th:value="1">1</option>
                <option th:value="2">2</option>
                <option th:value="3">3</option>
            </select>
        </div>
        <div class="form-group">
            <label>Mã việc làm *</label>
            <input type="text" th:field="*{job.jobId}" class="form-control" required placeholder="Nhập mã công việc">
        </div>
        <div class="form-group">
            <label >Số ngày công *</label>
            <input type="number" th:field="*{workdays}" class="form-control" required placeholder="Nhập số ngày công">
        </div>
        <span th:if="${amount != null}">
        Tổng số tiền: <p type="money" th:text="${amount}"></p>
        </span>
        <button type="submit" class="btn bg-primary">Create Post</button>
        <div th:if="${success != null}">
            <p style="color: green" th:text="${success}"></p>
        </div>
    </form>
</div>
</body>
</html>
