<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Registrations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Job Registrations</h2>

    <div class="mb-4">
        <form method="get" class="row g-3" th:action="@{/registration/search}">
            <div class="col-md-4">
                <select name="searchType" class="form-select">
                    <option value="employee">Employee Name</option>
                    <option value="job">Job ID</option>
                </select>
            </div>
            <div class="col-md-6">
                <input type="text" class="form-control" name="searchTerm" placeholder="Enter search term...">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Search</button>
            </div>
        </form>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Employee Name</th>
            <th>Job ID</th>
            <th>Job Name</th>
            <th>Working Days</th>
            <th>Total Amount</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="reg : ${registrations}">
            <td th:text="${reg.id}"></td>
            <td th:text="${reg.employee.fullName}"></td>
            <td th:text="${reg.job.jobId}"></td>
            <td th:text="${reg.job.jobName}"></td>
            <td th:text="${reg.workdays}"></td>
            <td th:text="${#numbers.formatDecimal(reg.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>
            <td>
                <a th:href="@{/registration/edit/{id}(id=${reg.id})}" class="btn btn-sm btn-primary">Update</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/registration/create}" class="btn btn-success">Create New Registration</a>
</div>
</body>
</html>
