<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/fStyle.css}">
</head>
<body>
<div th:replace="header :: header"></div>

    <div class="content">
        <h1>Posts Tagged: <span th:text="${tag}">Tag</span></h1>

        <div th:if="${#lists.isEmpty(posts)}">
            <p>No posts found with this tag.</p>
        </div>

        <div th:each="post : ${posts}" class="post">
            <h2><a th:href="@{/post/{id}(id=${post.id})}" th:text="${post.title}">Post Title</a></h2>
            <div class="post-meta">
                Posted on <span th:text="${#dates.format(post.createDate, 'dd MMM, yyyy')}">01 Jan, 2025</span>
            </div>
            <div class="post-content">
                <p th:text="${#strings.abbreviate(post.content, 300)}">Post content...</p>
            </div>
            <a th:href="@{/post/{id}(id=${post.id})}" class="read-more">Read More</a>
        </div>

        <!-- Pagination -->
        <div th:if="${totalPages > 1}" class="pagination">
            <a th:if="${currentPage > 0}" th:href="@{/tag/{name}(name=${tag}, page=${currentPage - 1})}">&laquo; Previous</a>
            <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:if="${i != currentPage}" th:href="@{/tag/{name}(name=${tag}, page=${i})}" th:text="${i + 1}">1</a>
                    <span th:if="${i == currentPage}" th:text="${i + 1}" class="current-page">1</span>
                </span>
            <a th:if="${currentPage < totalPages - 1}" th:href="@{/tag/{name}(name=${tag}, page=${currentPage + 1})}">Next &raquo;</a>
        </div>
    </div>
<div th:replace="footer :: footer"></div>

</body>
</html>
