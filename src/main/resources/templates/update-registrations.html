<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Job Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Update Job Registration</h2>

    <!-- Hiển thị lỗi nếu có -->
    <div th:if="${errorMessage != null}" class="alert alert-danger">
        <strong>Lỗi:</strong> <span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/registration/update/{id}(id=${jobRegistration.id})}" th:object="${jobRegistration}" method="post">
        <input type="hidden" class="form-control" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Employee ID</label>
            <input type="text" class="form-control" th:field="*{employee.employeeId}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Employee Name</label>
            <input type="text" class="form-control" th:field="*{employee.fullName}">
        </div>

        <div class="mb-3">
            <label class="form-label">Employee Gender</label>
            <input type="text" class="form-control" th:field="*{employee.gender}">
        </div>

        <div class="mb-3">
            <label class="form-label">Employee Level</label>
            <input type="text" class="form-control" th:field="*{employee.employeeLevel}">
        </div>

        <div class="mb-3">
            <label class="form-label">Working days</label>
            <input type="number" class="form-control" th:field="*{workdays}">
        </div>

        <div class="mb-3">
            <label class="form-label">Job ID</label>
            <input type="text" class="form-control" th:field="*{job.jobId}">
        </div>

        <!-- Hiển thị tổng tiền công -->
        <div class="mb-3">
            <label class="form-label">Total Amount (Trước khi cập nhật)</label>
            <p class="form-control" th:text="${jobRegistration.totalAmount}"></p>
        </div>

        <div th:if="${totalAmount != null}" class="mb-3">
            <label class="form-label">Total Amount (Sau khi cập nhật)</label>
            <p class="form-control text-success fw-bold" th:text="${totalAmount}"></p>
        </div>

        <button type="submit" class="btn btn-primary">Update</button>
        <a th:href="@{/registration/list}" class="btn btn-secondary">Cancel</a>
    </form>

</div>
</body>
</html>
