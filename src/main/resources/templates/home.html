<!DOCTYPE html>
<!--Home có chỗ đăng nhập, logout-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/fStyle.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        h1, h2, h3 {
            color: #333;
        }

        .container {
            max-width: 1100px;
        }

        .post {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .pagination {
            margin-top: 20px;
        }

        .pagination a {
            margin: 0 5px;
        }

        footer {
            background-color: #f1f1f1;
            padding: 10px 0;
        }
        .tags-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, auto));
            gap: 2px;
        }

        .tags-container a {
            display: inline-block;
            padding: 6px 12px;
            background-color: #0d6efd; /* Màu xanh lá */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
            transition: background-color 0.3s;
        }




    </style>
</head>
<body>

<div th:replace="header :: header"></div>
<!--<div th:replace="taskbar :: taskbar"></div>-->
<div class="container mt-4">
    <div class="row">
        <!-- Nội dung chính -->
        <div class="col-md-8">
            <h1 class="mb-4">Latest Posts</h1>
            <div th:if="${#lists.isEmpty(posts)}">
                <p>No posts available.</p>
            </div>
            <div th:each="post : ${posts}" class="mb-4 p-3 border rounded">
                <h2><a th:href="@{/post/{id}(id=${post.id})}" class="text-decoration-none text-dark" th:text="${post.title}">Post Title</a></h2>
                <div class="text-muted">
                    Posted on <span th:text="${#dates.format(post.createDate, 'dd MMM, yyyy')}">01 Jan, 2025</span>
                </div>
                <div class="tags-container">
                    <div th:each="tag : ${tags}">
                        <a th:href="@{/tag/{tag}(tag=${tag.name})}" th:text="${tag.name}"></a>
                    </div>
                </div>

                <p th:text="${#strings.abbreviate(post.content, 300)}" class="mt-2">Post content...</p>
                <a th:href="@{/post/{id}(id=${post.id})}" class="btn btn-primary">Read More</a>
            </div>

            <!-- Pagination -->
            <div th:if="${totalPages > 1}" class="pagination">
                <a th:if="${currentPage > 0}" th:href="@{/(page=${currentPage - 1})}" class="btn btn-outline-primary">&laquo; Previous</a>
                <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                        <a th:if="${i != currentPage}" th:href="@{/(page=${i})}" class="btn btn-outline-secondary" th:text="${i + 1}">1</a>
                        <span th:if="${i == currentPage}" class="btn btn-primary" th:text="${i + 1}">1</span>
                    </span>
                <a th:if="${currentPage < totalPages - 1}" th:href="@{/(page=${currentPage + 1})}" class="btn btn-outline-primary">Next &raquo;</a>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="col-md-4">
            <div th:replace="taskbar :: taskbar"></div>
        </div>
    </div>
</div>

<div th:replace="footer :: footer"></div>
</body>
</html>
