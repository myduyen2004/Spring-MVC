<!DOCTYPE html>
<!--CRUD posts-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Posts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/fStyle.css}">
</head>
<body>
<div th:replace="header :: header"></div>

<div class="container mt-4 row" style="margin-left: 20px ">
    <div class="col-md-8">
    <h2>Manage Posts</h2>
    <p>Displaying 1-2 of 2 result(s).</p>

    <table class="table table-bordered">
        <thead class="table-primary">
        <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Create Time</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(posts)}">
            <td colspan="5">No posts available</td>
        </tr>
        <tr th:each="post : ${posts}">
            <td th:text="${post.title}">Title</td>
            <td th:text="${#dates.format(post.createDate, 'dd MMM, yyyy')}">Date</td>
            <td>
                            <span th:each="status : ${statuses}"
                                  th:if="${status.code == post.status}"
                                  th:class="'status-' + ${status.name.toLowerCase()}"
                                  th:text="${status.name}">Status</span>
            </td>
            <td th:text="${post.tags}">Tags</td>
            <td class="action-buttons">
                <a th:href="@{/post/{id}(id=${post.id})}" title="View">View</a>
                <a th:href="@{/admin/post/edit/{id}(id=${post.id})}" title="Edit">Edit</a>
                <a th:href="@{/admin/post/delete/{id}(id=${post.id})}"
                   onclick="return confirm('Are you sure you want to delete this post?')"
                   title="Delete">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
    <div class="col-md-4">
        <div th:replace="taskbar :: taskbar"></div>
    </div>
</div>



<div th:replace="footer :: footer"></div>
</body>
</html>
