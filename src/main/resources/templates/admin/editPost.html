<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Posts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/fStyle.css}">
</head>
<body>
<div th:replace="header :: header"></div>
    <div class="admin-container">
        <h1>Edit Post</h1>

        <form th:action="@{/admin/post/edit/{id}(id=${post.id})}" method="post" th:object="${post}">
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" th:field="*{title}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="content">Content *</label>
                <textarea id="content" th:field="*{content}" class="form-control" required rows="10"></textarea>
            </div>
            <div class="form-group">
                <label for="tags">Tags</label>
                <input type="text" id="tags" th:field="*{tags}" class="form-control">
            </div>
            <div class="form-group">
                <label for="status">Status *</label>
                <select id="status" th:field="*{status}" class="form-control" required>
                    <option th:each="statusOption : ${statuses}"
                            th:value="${statusOption.code}"
                            th:text="${statusOption.name}">Status</option>
                </select>
            </div>
            <button type="submit" class="btn">Update Post</button>
            <a th:href="@{/admin/posts}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
<div th:replace="footer :: footer"></div>

</body>
</html>
