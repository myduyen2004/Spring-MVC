<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Contact</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  \<link rel="stylesheet" th:href="@{/css/fStyle.css}">
</head>
<body>
<div th:replace="header :: header"></div>
  <div class="content" style= "margin: 50px">
    <h1>Contact</h1>
    <p>Feel free to reach out with any questions or feedback about the blog.</p>

    <form class="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" class="form-control" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" required placeholder="Your email">
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" class="form-control" required placeholder="Subject">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" class="form-control" required placeholder="Your message"></textarea>
      </div>
      <button type="submit" class="btn bg-primary">Send Message</button>
    </form>
  </div>
<div th:replace="footer :: footer"></div>
</body>
</html>
