<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ? ${title} + ' - Blog' : 'Blog'">Blog</title>
    <link rel="stylesheet" th:href="@{/css/fStyle.css}">


</head>
<body>
<!-- Banner -->
<div class="banner">
    <div class="container">
        <h1>My Spring Blog</h1>
        <p>A simple blog built with Spring Framework</p>
    </div>
</div>

<!-- Menu/Navigation -->
<header>
    <div class="container">
        <h1>Blog</h1>
        <nav>
            <ul>
                <li><a th:href="@{/}">Home</a></li>
                <li><a th:href="@{/about}">About</a></li>
                <li><a th:href="@{/contact}">Contact</a></li>
                <li th:if="${session.user}"><a th:href="@{/admin/posts}">Manage</a></li>
                <li th:if="${session.user}"><a th:href="@{/logout}">Logout</a></li>
                <li th:unless="${session.user}"><a th:href="@{/login}">Login</a></li>
            </ul>
        </nav>
    </div>
</header>

<!-- Main Content -->
<div class="container">
    <div th:replace=":: content"></div>
</div>

<!-- Footer -->
<footer>
    <p>&copy; 2025 My Spring Blog. All rights reserved.</p>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
